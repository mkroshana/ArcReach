name: Build and Deploy ArcReach to Azure

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy ArcReach to Azure
    runs-on: ubuntu-latest
    
    env:
      RESOURCE_GROUP: Self_Hosted-Apps
      APP_NAME: arcreach
      AZURE_LOCATION: eastus
      # Database and Admin credentials stored securely in GitHub Secrets
      DB_ADMIN_USER: arcadmin
      DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies & Run Tests
      run: |
        npm ci
        npm run test:ci

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Resolve resource names dynamically by deploying the Bicep template
    # Bicep is idempotent; it will output the registry details even if resources exist
    - name: Provision/Verify Infrastructure (Bootstrap phase)
      id: bicep
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ env.RESOURCE_GROUP }}
        template: ./infra/main.bicep
        parameters: >
          location=${{ env.AZURE_LOCATION }}
          appName=${{ env.APP_NAME }}
          deployContainerApp=false
          dbAdminPassword=${{ env.DB_ADMIN_PASSWORD }}
          adminPassword=${{ env.ADMIN_PASSWORD }}
          adminEmail=${{ env.ADMIN_EMAIL }}

    # Extract outputs from the Bicep bootstrap deployment
    - name: Set Deployment Variables
      run: |
        echo "ACR_NAME=${{ steps.bicep.outputs.acrName }}" >> $GITHUB_ENV
        echo "ACR_LOGIN_SERVER=${{ steps.bicep.outputs.acrLoginServer }}" >> $GITHUB_ENV
        echo "PG_FQDN=${{ steps.bicep.outputs.pgFqdn }}" >> $GITHUB_ENV

    # Offloads the build to ACR. Faster build times and keeps the script clean.
    - name: Build and Push Container Image (Cloud Build)
      run: |
        az acr build --registry ${{ env.ACR_NAME }} --image arcreach:latest .

    # Dynamically whitelist the GitHub Runner IP to run database migrations
    - name: Deploy Database Schema (Prisma)
      id: deploy-db
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "GitHub Runner IP: $RUNNER_IP"
        
        SERVER_NAME=$(az postgres flexible-server list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
        echo "PostgreSQL Server Name: $SERVER_NAME"
        
        echo "Adding temporary firewall rule to PostgreSQL Flexible Server..."
        az postgres flexible-server firewall-rule create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name $SERVER_NAME \
          --rule-name AllowGitHubRunner-${{ github.run_id }} \
          --start-ip-address $RUNNER_IP \
          --end-ip-address $RUNNER_IP \
          --query "properties"
          
        # Wait a few seconds for firewall rule propagation
        sleep 5
        
        echo "Running Prisma migrations..."
        export DATABASE_URL="postgresql://${{ env.DB_ADMIN_USER }}:${{ env.DB_ADMIN_PASSWORD }}@${{ env.PG_FQDN }}:5432/arcreach?sslmode=require"
        npx prisma db push --accept-data-loss
        
        echo "Running admin user seeding..."
        export ADMIN_EMAIL=${{ env.ADMIN_EMAIL }}
        export ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD }}
        export ADMIN_NAME="ArcReach Admin"
        npx tsx scripts/seed-admin.ts

      # Always run cleanup even if migrations fail, provided the deployment step was executed
    - name: PostgreSQL Firewall Cleanup
      if: always() && steps.deploy-db.outcome != 'skipped'
      run: |
        echo "Removing temporary firewall rule from PostgreSQL Flexible Server..."
        SERVER_NAME=$(az postgres flexible-server list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
        if [ ! -z "$SERVER_NAME" ]; then
          az postgres flexible-server firewall-rule delete \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name $SERVER_NAME \
            --rule-name AllowGitHubRunner-${{ github.run_id }} \
            --yes || true
        fi

    # Final step: deploy the container app pointing to the newly uploaded image
    - name: Complete Container App Deployment
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ env.RESOURCE_GROUP }}
        template: ./infra/main.bicep
        parameters: >
          location=${{ env.AZURE_LOCATION }}
          appName=${{ env.APP_NAME }}
          deployContainerApp=true
          dbAdminPassword=${{ env.DB_ADMIN_PASSWORD }}
          adminPassword=${{ env.ADMIN_PASSWORD }}
          adminEmail=${{ env.ADMIN_EMAIL }}
