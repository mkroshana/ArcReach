# Deploy ArcReach to Azure App Service
# Oryx handles npm install + npm run build on the server (SCM_DO_BUILD_DURING_DEPLOYMENT=true)

name: Build and deploy Node.js app to Azure Web App - arcreach-app

on:
  push:
    branches:
      - azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm run test:ci

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "node_modules/*" ".next/*" ".git/*" ".env*" "*.log"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6DDACB0C93C4FA9BDC449D735526B8D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F57951493C6D4CE28217DB3BB321233D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9ACF123306674D4F93446DDA5DCC81C6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'arcreach-app'
          slot-name: 'Production'
          package: deploy.zip