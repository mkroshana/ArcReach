# CI/CD for ArcReach (`azure` branch)
# Production runs on homelab LXC CT 211 (`jpm-mail`, migrated off Azure on 2026-11-19).
#
# Three jobs:
#   - test:   installs deps, runs unit + integration suites against a fresh
#             Postgres 16 service container and a backgrounded `next dev` server.
#             Runs on every push to `azure` and on workflow_dispatch.
#   - build:  needs `test`; runs `npm ci`, `prisma generate`, and `next build`
#             to verify the production bundle compiles cleanly.
#   - deploy: needs `test` and `build`; only runs on push to `azure` (not
#             workflow_dispatch). Posts an HMAC-SHA256 signed request to CT 211's
#             deploy webhook (`/_hooks/deploy`), which runs `/usr/local/bin/arcreach-deploy`.
#             Schema changes still fail the deploy until applied manually with `--push-schema`.
#
# Actions are pinned to commit SHAs (release tag in the comment beside each).

name: Test, build, and deploy ArcReach

on:
  push:
    branches:
      - azure
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arcreach_test
      NODE_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma schema to test database
        run: npx prisma db push --skip-generate

      - name: Seed default dev users (admin-id-999, user-id-111)
        run: npm run seed:dev

      - name: Save a verified test sender domain
        # POST /api/accounts refuses sender addresses on unverified domains, so the
        # mailbox and campaign integration tests need one in this test database.
        run: |
          npx prisma db execute --schema schema.prisma --stdin <<'SQL'
          INSERT INTO "GlobalSettings" ("id", "activeProvider", "azureSenderDomains", "updatedAt")
          VALUES ('global', 'DISABLED', '["example.com"]'::jsonb, now())
          ON CONFLICT ("id") DO UPDATE SET "azureSenderDomains" = '["example.com"]'::jsonb;
          SQL

      - name: Run unit tests
        run: npm run test:ci

      - name: Start dev server
        run: |
          npm run dev > /tmp/devserver.log 2>&1 &
          echo $! > /tmp/devserver.pid

      - name: Wait for dev server to be ready
        # Probes the public /login page: API routes answer a request with no session cookie with 401.
        # Only a 200 counts: curl does not follow redirects, so a redirect or error page keeps waiting.
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$code" = "200" ]; then
              echo "Dev server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Dev server did not answer /login with 200 in 120s (last status $code). Last 100 lines of log:"
          tail -n 100 /tmp/devserver.log || true
          exit 1

      - name: Run integration tests
        # The suite refuses to run without this opt-in, and only against a local or
        # test DATABASE_URL (here the arcreach_test service container).
        env:
          ARCREACH_INTEGRATION_TESTS: 'true'
        run: npm run test:integration

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/devserver.pid ]; then
            kill $(cat /tmp/devserver.pid) 2>/dev/null || true
          fi

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devserver-log
          path: /tmp/devserver.log
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install, generate Prisma client, and build
        run: |
          npm ci
          npx prisma generate
          npm run build

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/azure'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger homelab CT 211 deploy webhook
        env:
          DEPLOY_SECRET: ${{ secrets.HOMELAB_DEPLOY_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::HOMELAB_DEPLOY_SECRET repository secret is not set."
            exit 1
          fi
          TS=$(date +%s)
          BODY=$(printf '{"ref":"refs/heads/azure","sha":"%s"}' "$COMMIT_SHA")
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | awk '{print $NF}')
          HTTP_CODE=$(curl -sS --max-time 420 \
            -o /tmp/deploy-response.json \
            -w '%{http_code}' \
            -X POST https://arcreach.thejobshelpers.com/_hooks/deploy \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Timestamp: ${TS}" \
            -H "X-Deploy-Signature: sha256=${SIG}" \
            --data-raw "$BODY")
          echo "Deploy webhook HTTP status: ${HTTP_CODE}"
          cat /tmp/deploy-response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Homelab deploy failed (HTTP ${HTTP_CODE})."
            exit 1
          fi
