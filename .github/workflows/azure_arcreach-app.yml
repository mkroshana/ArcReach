# Deploy ArcReach to Azure App Service
# Build happens in CI (fast GitHub runner), Azure just starts the app.
#
# Two jobs:
#   - test:              installs deps, runs unit + integration suites against
#                        a fresh Postgres service container and a backgrounded
#                        `next dev` server. Runs on every push to `azure` and
#                        on workflow_dispatch.
#   - build-and-deploy:  needs `test`; only runs on push to `azure`, so manual
#                        workflow_dispatch can re-run tests without redeploying.
#                        Fails before deploying while the Azure database schema
#                        differs from schema.prisma (read-only check, needs the
#                        AZURE_DATABASE_URL secret; skipped with a warning without it).
#
# Actions are pinned to commit SHAs (release tag in the comment beside each), so a
# moved tag cannot change what runs with the Azure credentials.

name: Build and deploy Node.js app to Azure Web App - arcreach-app

on:
  push:
    branches:
      - azure
  workflow_dispatch:

# One run at a time per trigger. A push waits for the previous push's run instead of
# cancelling it mid-deploy, so deploys land in push order; a newer push replaces one
# still waiting. Runs started by hand only test and wait in their own group, so they
# never replace a waiting deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# The GITHUB_TOKEN only reads the repository; build-and-deploy adds id-token: write
# for the Azure OpenID Connect login.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arcreach_test
      NODE_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma schema to test database
        run: npx prisma db push --skip-generate

      - name: Seed default dev users (admin-id-999, user-id-111)
        run: npm run seed:dev

      - name: Save a verified test sender domain
        # POST /api/accounts refuses sender addresses on unverified domains, so the
        # mailbox and campaign integration tests need one in this test database.
        run: |
          npx prisma db execute --schema schema.prisma --stdin <<'SQL'
          INSERT INTO "GlobalSettings" ("id", "activeProvider", "azureSenderDomains", "updatedAt")
          VALUES ('global', 'DISABLED', '["example.com"]'::jsonb, now())
          ON CONFLICT ("id") DO UPDATE SET "azureSenderDomains" = '["example.com"]'::jsonb;
          SQL

      - name: Run unit tests
        run: npm run test:ci

      - name: Start dev server
        run: |
          npm run dev > /tmp/devserver.log 2>&1 &
          echo $! > /tmp/devserver.pid

      - name: Wait for dev server to be ready
        # Probes the public /login page: API routes answer a request with no session cookie with 401.
        # Only a 200 counts: curl does not follow redirects, so a redirect or error page keeps waiting.
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$code" = "200" ]; then
              echo "Dev server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Dev server did not answer /login with 200 in 120s (last status $code). Last 100 lines of log:"
          tail -n 100 /tmp/devserver.log || true
          exit 1

      - name: Run integration tests
        # The suite refuses to run without this opt-in, and only against a local or
        # test DATABASE_URL (here the arcreach_test service container).
        env:
          ARCREACH_INTEGRATION_TESTS: 'true'
        run: npm run test:integration

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/devserver.pid ]; then
            kill $(cat /tmp/devserver.pid) 2>/dev/null || true
          fi

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devserver-log
          path: /tmp/devserver.log
          if-no-files-found: ignore

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/azure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check the Azure database schema matches schema.prisma
        # Read-only: `prisma migrate diff` compares the live database with schema.prisma
        # and never changes it. Code whose columns the database lacks fails its queries
        # (P2022), so schema changes are pushed with `npx prisma db push` before deploying
        # (README: Deploying Updates). Skipped with a warning while the AZURE_DATABASE_URL
        # secret is not set.
        env:
          DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning title=Database Schema Not Checked::The AZURE_DATABASE_URL secret is not set, so this deploy did not check that the Azure database has the schema.prisma changes. Add the secret (README: Deploying Updates) to block deploys while the database schema is behind."
            exit 0
          fi
          status=0
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel schema.prisma --exit-code || status=$?
          if [ "$status" -eq 0 ]; then
            echo "The Azure database schema matches schema.prisma."
          elif [ "$status" -eq 2 ]; then
            echo "::error title=Database Schema Is Behind::The Azure database does not match schema.prisma (the changes db push would make are listed above). Run npx prisma db push against the Azure database first (README: Deploying Updates), then re-run this job."
            exit 1
          else
            echo "::error title=Database Schema Check Failed::Could not compare the Azure database with schema.prisma (prisma exited with $status). Check the AZURE_DATABASE_URL secret and that the database firewall admits GitHub-hosted runners."
            exit 1
          fi

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            -x "node_modules/.cache/*" \
            -x ".git/*" \
            -x ".env*" \
            -x "*.log" \
            -x ".next/cache/*"

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6DDACB0C93C4FA9BDC449D735526B8D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F57951493C6D4CE28217DB3BB321233D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9ACF123306674D4F93446DDA5DCC81C6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'arcreach-app'
          slot-name: 'Production'
          package: deploy.zip
